[workspace]
resolver = "3"
members = [
    "crates/thinoda-core",
    "crates/thinoda-io",
    "crates/thinoda-platform",
    "crates/thinoda-ui",
    "crates/thinoda-canvas",
    "crates/thinoda-ai",
    "crates/thinoda-app",
    "crates/thinoda-web",
    "xtask",
]
default-members = [
    "crates/thinoda-core",
    "crates/thinoda-io",
    "crates/thinoda-platform",
    "crates/thinoda-ui",
    "crates/thinoda-canvas",
    "crates/thinoda-ai",
    "crates/thinoda-app",
]

[workspace.package]
version = "0.5.4" # x-release-please-version
edition = "2024"
rust-version = "1.89"
license = "EUPL-1.2"
repository = "https://github.com/AxelWol/Thinoda"
authors = ["Axel Wolters <axelwolters@hotmail.com>"]
homepage = "https://github.com/AxelWol/Thinoda"

[workspace.dependencies]
thinoda-core = { path = "crates/thinoda-core", version = "0.5.4" } # x-release-please-version
thinoda-io = { path = "crates/thinoda-io", version = "0.5.4" } # x-release-please-version
thinoda-platform = { path = "crates/thinoda-platform", version = "0.5.4" } # x-release-please-version
thinoda-ui = { path = "crates/thinoda-ui", version = "0.5.4" } # x-release-please-version
thinoda-canvas = { path = "crates/thinoda-canvas", version = "0.5.4" } # x-release-please-version
thinoda-ai = { path = "crates/thinoda-ai", version = "0.5.4" } # x-release-please-version
thinoda-app = { path = "crates/thinoda-app", version = "0.5.4" } # x-release-please-version

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
toml = "1"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence", "wayland", "x11"] }
egui_kittest = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.48"
fontdb = "0.24"
tempfile = "3"
env_logger = "0.11"
sys-locale = "0.3"
base64 = "0.23"
ureq = { version = "3", features = ["json"] }
# Web (wasm32) target. Versions match eframe's web backend.
web-time = "1"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.103"
web-sys = "0.3.103"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind" # needed so the crash handler can write recovery data

[profile.dev.package."*"]
opt-level = 2
