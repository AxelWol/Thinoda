ymind-platform.workspace = true
ymind-ui.workspace = true
ymind-canvas.workspace = true
ymind-ai.workspace = true
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
image.workspace = true
uuid.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
sys-locale.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
