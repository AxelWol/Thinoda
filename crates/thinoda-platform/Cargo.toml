[package]
name = "thinoda-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thinoda-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
uuid.workspace = true
thiserror.workspace = true
log.workspace = true
raw-window-handle = "0.6"
web-time.workspace = true
base64.workspace = true
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "HtmlAnchorElement", "Node", "Storage", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "console"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile.workspace = true
