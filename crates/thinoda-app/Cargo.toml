[package]
name = "thinoda-app"
description = "Thinoda - Give your thoughts shape. A fast, cross-platform mind mapping app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
default-run = "thinoda"

[features]
gpu-tests = ["egui_kittest/wgpu"]

[lib]
name = "thinoda_app"
path = "src/lib.rs"

[[bin]]
name = "thinoda"
path = "src/main.rs"

[dependencies]
thinoda-core.workspace = true
thinoda-io.workspace = true
thinoda-platform.workspace = true
thinoda-ui.workspace = true
thinoda-canvas.workspace = true
thinoda-ai.workspace = true
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
image.workspace = true
uuid.workspace = true
log.workspace = true
anyhow.workspace = true
sys-locale.workspace = true
web-time.workspace = true
raw-window-handle = "0.6"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

# Browser build (`crates/thinoda-web`): async file pickers and downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
wasm-bindgen-futures.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_system_font_provider = "0.37"

[build-dependencies]
winresource = "0.1.34"

# Installers: `cargo xtask package` (wraps `cargo packager --release -p thinoda-app`).
[package.metadata.packager]
product-name = "Thinoda"
identifier = "io.github.axelwol.thinoda"
publisher = "Axel Wolters"
copyright = "Copyright © 2026 Axel Wolters. Licensed under the EUPL-1.2."
category = "Productivity"
description = "Give your thoughts shape. Fast, cross-platform mind mapping"
long-description = "Give your thoughts shape. Thinoda is a free, GPU-accelerated mind mapping app with XMind, FreeMind, OPML and Markdown import/export, crash-safe autosave and an optional local AI assistant."
out-dir = "../../target/packages"
license-file = "../../LICENSE.md"
# icon.ico: Windows (16–256 px), icon.icns: macOS (16 pt–512 pt @2x), PNGs: Linux hicolor sizes.
# Regenerate with `cargo xtask icons`.
icons = [
    "../../assets/icon.ico",
    "../../assets/icon.icns",
    "../../assets/icon-512.png",
    "../../assets/icon-256.png",
    "../../assets/icon-128.png",
    "../../assets/icon-64.png",
    "../../assets/icon-48.png",
    "../../assets/icon-32.png",
    "../../assets/icon-24.png",
    "../../assets/icon-16.png",
]
binaries = [{ path = "thinoda", main = true }]

[[package.metadata.packager.file-associations]]
extensions = ["thinoda"]
name = "Thinoda Map"
description = "Thinoda mind map"
mime-type = "application/x-thinoda"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["xmind"]
name = "XMind Map"
description = "XMind mind map"
mime-type = "application/vnd.xmind.workbook"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["mm"]
name = "FreeMind Map"
description = "FreeMind / Freeplane mind map"
mime-type = "application/x-freemind"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["opml"]
name = "OPML Outline"
description = "OPML outline"
mime-type = "text/x-opml"
role = "viewer"

[[package.metadata.packager.file-associations]]
extensions = ["mmap", "xmmap"]
name = "MindManager Map"
description = "MindManager map (conversion-only opening)"
role = "viewer"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
languages = ["English", "German", "Spanish", "French", "Danish", "Dutch", "Portuguese", "PortugueseBR", "Italian", "Polish"]
display-language-selector = true
# Translate every custom control, independently of packager's built-in coverage.
custom-language-file = { German = "../../assets/installer/German.nsh", Spanish = "../../assets/installer/Spanish.nsh", French = "../../assets/installer/French.nsh", Danish = "../../assets/installer/Danish.nsh", Dutch = "../../assets/installer/Dutch.nsh", Portuguese = "../../assets/installer/Portuguese.nsh", PortugueseBR = "../../assets/installer/PortugueseBR.nsh", Italian = "../../assets/installer/Italian.nsh", Polish = "../../assets/installer/Polish.nsh" }

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "../../assets/installer/Info.plist"
# Seal the complete bundle; the ARM64 linker's signature alone is invalid in a .app.
# Ad-hoc signing does not provide Developer ID trust or Apple notarization.
signing-identity = "-"

[package.metadata.packager.deb]
section = "editors"
# AppImage also uses cargo-packager's Debian desktop-file generation.
desktop-template = "../../assets/installer/thinoda.desktop"
# winit/wgpu load most windowing/GPU libraries with dlopen. Native printing also
# loads the host GTK 3 stack and its CUPS modules as a unit (including AppImage),
# so these runtime libraries must be explicit (names valid on 22.04+).
depends = [
    "libfontconfig1",
    "libgtk-3-0",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb1",
    "libx11-6",
    "libx11-xcb1",
    "libxcursor1",
    "libxrandr2",
    "libxi6",
    "libwayland-client0",
    "libwayland-cursor0",
    "libwayland-egl1",
    "libgl1",
    "libegl1",
    "libvulkan1",
]
