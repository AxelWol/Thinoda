[package]
name = "thinoda-ai"
description = "Thinoda AI assistant: OpenAI-compatible client (LM Studio, Ollama, OpenAI, Azure OpenAI) and mind-map prompts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
reqwest.workspace = true
tokio.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

# The browser build talks to the server with `fetch` (the endpoint must allow CORS).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Request", "RequestInit", "RequestMode", "Response", "Headers", "AbortSignal", "AbortController", "ReadableStream", "ReadableStreamDefaultReader"] }
