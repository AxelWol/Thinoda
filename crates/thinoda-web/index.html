<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Thinoda - Give your thoughts shape. A mind mapping app that runs entirely in your browser.">
    <meta name="theme-color" content="#1f2430">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Thinoda">
    <title>Thinoda</title>
    <script id="thinoda-bootstrap-guard">
        (() => {
            let started = false;
            let reported = false;
            let settleBootstrap;
            window.thinodaBootstrapSettled = new Promise(resolve => { settleBootstrap = resolve; });
            window.addEventListener("TrunkApplicationStarted", () => {
                started = true;
                settleBootstrap();
            }, { once: true });

            const report = () => {
                if (started || reported) return;
                settleBootstrap();
                const loading = document.getElementById("loading");
                if (!loading) {
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", report, { once: true });
                    }
                    return;
                }
                reported = true;
                loading.textContent = "";
                loading.className = "error";
                loading.setAttribute("role", "alert");
                loading.setAttribute("aria-live", "assertive");
                const heading = document.createElement("h2");
                heading.textContent = "Thinoda could not load";
                const detail = document.createElement("p");
                detail.textContent = "The app could not download or start. Check your connection and reload. "
                    + "Do not clear browser data; it may contain your documents.";
                const retry = document.createElement("a");
                const retryUrl = new URL(window.location.href);
                const retryToken = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
                retryUrl.searchParams.set("__thinoda_retry", retryToken);
                retry.href = retryUrl.href;
                try {
                    window.sessionStorage.setItem("thinoda-bootstrap-retry", retryToken);
                } catch (error) {
                    console.warn("Could not remember the bootstrap retry for a browser reload", error);
                }
                retry.textContent = "Reload Thinoda";
                loading.append(heading, detail, retry);
            };
            window.thinodaBootstrapFailed = report;
            window.addEventListener("error", event => {
                if (event.target?.id === "thinoda-app-bootstrap") report();
            }, true);
        })();
    </script>
    <link data-trunk rel="rust" data-bin="thinoda-web" data-wasm-opt="2" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals">
    <link data-trunk rel="icon" href="../../assets/icon-64.png">
    <link data-trunk rel="copy-file" href="../../assets/icon-256.png">
    <link data-trunk rel="copy-file" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="pwa.js">
    <link data-trunk rel="copy-dir" href="../../assets/pwa-icons">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="152x152" href="pwa-icons/apple-touch-icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="pwa-icons/apple-touch-icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="pwa-icons/apple-touch-icon.png">
    <script src="pwa.js" defer></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1f2430; }
        canvas#thinoda_canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
        .screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
        #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; color: #e6e9ef; font: 16px system-ui, sans-serif; text-align: center; padding: 24px; }
        #loading img { width: 96px; height: 96px; animation: loading-pulse 1.8s ease-in-out infinite; }
        @keyframes loading-pulse {
            0%, 100% { opacity: .76; transform: scale(.97); }
            50% { opacity: 1; transform: scale(1); }
        }
        #loading.error { color: #ffb4a9; justify-content: flex-start; overflow-y: auto; box-sizing: border-box; }
        #loading.error img { animation: none; }
        #loading.error h2 { margin: 24px 0 0; }
        #loading.error p, #loading.error ol, #loading.error details { max-width: 640px; margin: 0; color: #e6e9ef; text-align: left; line-height: 1.5; }
        #loading.error li { margin-bottom: 8px; }
        #loading.error a { color: #8ab4f8; }
        #loading.error code { background: #2b3140; padding: 1px 4px; border-radius: 3px; }
        #loading.error pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #aab1bf; }
        .pwa-install { color-scheme: dark; color: #e6e9ef; background: #1f2430;
            font: 16px/1.5 system-ui, sans-serif; max-width: min(36rem, calc(100vw - 4rem));
            max-height: calc(100dvh - 4rem); overflow: auto; border: 1px solid #8a93a5;
            border-radius: 12px; padding: 24px; }
        .pwa-install::backdrop { background: #0009; }
        .pwa-install button { font: inherit; padding: 8px 16px; margin: 4px; }
        .pwa-install button:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 2px; }
        .pwa-install [role="status"] { white-space: pre-wrap; overflow-wrap: anywhere; }
        @media (prefers-reduced-motion: reduce) {
            #loading img { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="thinoda_canvas"></canvas>
    <div id="thinoda-recovery-availability" class="screen-reader-only" role="alert" aria-atomic="true"></div>
    <div id="thinoda-recovery-cleanup" class="screen-reader-only" role="alert" aria-atomic="true"></div>
    <div id="thinoda-recovery-discovery" class="screen-reader-only" role="alert" aria-atomic="true"></div>
    <div id="thinoda-recovery-download" class="screen-reader-only" role="alert" aria-atomic="true"></div>
    <div id="thinoda-browser-migration" class="screen-reader-only" role="alert" aria-atomic="true"></div>
    <div id="loading" lang="en" role="status" aria-live="polite" aria-atomic="true">
        <img src="icon-256.png" alt="">
        <noscript>Thinoda needs JavaScript and WebAssembly to run.</noscript>
        <span id="loading-message">Loading Thinoda…</span>
    </div>
</body>
</html>
