[package]
name = "thinoda-web"
description = "Thinoda as a static web app (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Built with `trunk build --release` from this directory (see docs/WEB.md).
[[bin]]
name = "thinoda-web"
path = "src/main.rs"

[dependencies]
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
thinoda-app.workspace = true
thinoda-platform.workspace = true
eframe.workspace = true
egui.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Event", "EventTarget", "BeforeUnloadEvent", "CssStyleDeclaration", "PageTransitionEvent"] }
