[package]
name = "thinoda-web"
description = "Thinoda as a static web app (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = []
integrated-cloud-services = ["thinoda-app/integrated-cloud-services"]

# Built with `trunk build --release` from this directory (see docs/WEB.md).
[[bin]]
name = "thinoda-web"
path = "src/main.rs"

[dependencies]
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
thinoda-app.workspace = true
thinoda-canvas.workspace = true
thinoda-platform.workspace = true
eframe.workspace = true
egui.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Node", "HtmlCanvasElement", "HtmlElement", "Event", "EventTarget", "PointerEvent", "MouseEvent", "Touch", "TouchList", "TouchEvent", "DomRect", "BeforeUnloadEvent", "CssStyleDeclaration", "PageTransitionEvent"] }

[dev-dependencies]
egui.workspace = true
egui_kittest.workspace = true
thinoda-ui.workspace = true
