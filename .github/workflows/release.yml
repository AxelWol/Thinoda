name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag (e.g. v0.1.0) to build and publish; empty = artifacts only"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: false
      MACOS_CERT_P12:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      APPLE_API_KEY_P8:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  THINODA_AI_SKIP_LIVE: "1"

jobs:
  macos-intel:
    name: macOS Intel first
    uses: ./.github/workflows/package-target.yml
    with:
      os: macos-15-intel
      target: x86_64-apple-darwin
      formats: app,dmg
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  windows:
    name: Windows
    needs: macos-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: nsis }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, formats: nsis }
    uses: ./.github/workflows/package-target.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      formats: ${{ matrix.formats }}
      ref: ${{ inputs.tag || github.ref }}

  linux-x86:
    name: Linux x86
    needs: macos-intel
    uses: ./.github/workflows/package-target.yml
    with:
      # Oldest supported Ubuntu LTS for the widest x86 glibc compatibility.
      os: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      formats: deb,appimage
      ref: ${{ inputs.tag || github.ref }}

  linux-arm:
    name: Linux ARM64 after Linux x86
    needs: linux-x86
    uses: ./.github/workflows/package-target.yml
    with:
      os: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      formats: deb,appimage
      ref: ${{ inputs.tag || github.ref }}

  macos-silicon:
    name: Apple Silicon last
    needs: [windows, linux-arm]
    uses: ./.github/workflows/package-target.yml
    with:
      os: macos-latest
      target: aarch64-apple-darwin
      formats: app,dmg
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  publish:
    needs: [macos-intel, windows, linux-x86, linux-arm, macos-silicon]
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: thinoda-*
          merge-multiple: true
      # Creates the release (or updates the one created by release-please) and
      # attaches every installer and checksum manifest as a download.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          make_latest: true
          fail_on_unmatched_files: true

  winget:
    needs: publish
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
