name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag (e.g. v0.1.0) to build and publish; empty = artifacts only"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: false
      MACOS_CERT_P12:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      APPLE_API_KEY_P8:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  THINODA_AI_SKIP_LIVE: "1"

jobs:
  package:
    name: package (${{ matrix.target }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: nsis }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, formats: nsis }
          - { os: macos-latest, target: aarch64-apple-darwin, formats: "app,dmg" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, formats: "app,dmg" }
          # Oldest supported Ubuntu LTS for the widest glibc compatibility.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      # The release build, the debug test build and the AppImage tooling exceed
      # the ~14 GB free on hosted Ubuntu runners; drop unused preinstalled SDKs.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libfuse2 xvfb
      - name: Test release artifact preparation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Test on the native target
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Drop debug test build to save disk space
        shell: bash
        run: rm -rf target/${{ matrix.target }}/debug
      - name: Install pinned packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Import macOS signing certificate and notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY \
            KEYCHAIN_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          umask 077
          cert="$RUNNER_TEMP/thinoda-signing.p12"
          keychain="$RUNNER_TEMP/thinoda-build.keychain-db"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$cert"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/thinoda-AuthKey.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
      - name: Build installers
        if: runner.os != 'macOS'
        run: cargo xtask package --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: Build, sign and notarize macOS installers
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/thinoda-AuthKey.p8
        run: python .github/scripts/package_macos.py --target ${{ matrix.target }}
      - name: Prepare architecture-specific downloads and checksums
        run: python .github/scripts/release_artifacts.py --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: Verify macOS downloads and installed app signatures
        if: runner.os == 'macOS'
        run: python .github/scripts/verify_macos_packages.py --target ${{ matrix.target }} --require-notarization
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/thinoda-signing.p12" "$RUNNER_TEMP/thinoda-AuthKey.p8"
          keychain="$RUNNER_TEMP/thinoda-build.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: thinoda-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: thinoda-*
          merge-multiple: true
      # Creates the release (or updates the one created by release-please) and
      # attaches every installer and checksum manifest as a download.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          make_latest: true
          fail_on_unmatched_files: true

  winget:
    needs: publish
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
