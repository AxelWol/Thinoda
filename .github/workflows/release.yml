name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  YMIND_AI_SKIP_LIVE: "1"

jobs:
  package:
    name: package (${{ matrix.target }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: nsis }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, formats: nsis }
          - { os: macos-latest, target: aarch64-apple-darwin, formats: "app,dmg" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, formats: "app,dmg" }
          # Oldest supported Ubuntu LTS for the widest glibc compatibility.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libfuse2
      - name: Test release artifact preparation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Test on the native target
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Install pinned packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build installers
        run: cargo xtask package --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: Prepare architecture-specific downloads and checksums
        run: python .github/scripts/release_artifacts.py --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: ymind-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ymind-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
