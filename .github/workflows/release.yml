name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  YMIND_AI_SKIP_LIVE: "1"

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: nsis }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, formats: nsis }
          - { os: macos-latest, target: aarch64-apple-darwin, formats: "app,dmg" }
          - { os: macos-latest, target: x86_64-apple-darwin, formats: "app,dmg" }
          # Oldest supported Ubuntu LTS for the widest glibc compatibility.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libfuse2
      - run: cargo test --workspace --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo xtask package --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: ymind-${{ matrix.target }}
          path: |
            target/packages/*.exe
            target/packages/*.dmg
            target/packages/*.deb
            target/packages/*.AppImage
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
