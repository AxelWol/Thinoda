name: Package target

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      formats:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  THINODA_AI_SKIP_LIVE: "1"

jobs:
  package:
    name: package (${{ inputs.target }})
    timeout-minutes: 120
    runs-on: ${{ inputs.os }}
    steps:
      # The release/debug builds and AppImage tooling exceed hosted Linux disk space.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if [[ "$(lsb_release -rs)" == "24.04" ]]; then
            fuse_package=libfuse2t64
          fi
          sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev "$fuse_package" xvfb
      - name: Test release artifact preparation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Test on the native target
        run: cargo test --locked --workspace --target ${{ inputs.target }}
      - name: Drop debug test build to save disk space
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: rm -rf "target/$TARGET/debug"
      - name: Install pinned packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Import macOS signing certificate and notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY \
            KEYCHAIN_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          umask 077
          cert="$RUNNER_TEMP/thinoda-signing.p12"
          keychain="$RUNNER_TEMP/thinoda-build.keychain-db"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$cert"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/thinoda-AuthKey.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
      - name: Build installers
        if: runner.os != 'macOS'
        env:
          TARGET: ${{ inputs.target }}
          FORMATS: ${{ inputs.formats }}
        shell: bash
        run: cargo xtask package --target "$TARGET" --formats "$FORMATS"
      - name: Build, sign and notarize macOS installers
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/thinoda-AuthKey.p8
          TARGET: ${{ inputs.target }}
        shell: bash
        run: python .github/scripts/package_macos.py --target "$TARGET"
      - name: Prepare architecture-specific downloads and checksums
        env:
          TARGET: ${{ inputs.target }}
          FORMATS: ${{ inputs.formats }}
        shell: bash
        run: python .github/scripts/release_artifacts.py --target "$TARGET" --formats "$FORMATS"
      - name: Verify macOS downloads and installed app signatures
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: python .github/scripts/verify_macos_packages.py --target "$TARGET" --require-notarization
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/thinoda-signing.p12" "$RUNNER_TEMP/thinoda-AuthKey.p8"
          keychain="$RUNNER_TEMP/thinoda-build.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: thinoda-${{ inputs.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
