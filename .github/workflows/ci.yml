name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  THINODA_AI_SKIP_LIVE: "1"

jobs:
  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: THIRD_PARTY_NOTICES.md matches Cargo.lock
        run: python3 .github/scripts/third_party_notices.py --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test release artifact preparation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p thinoda-core --example layout_benchmark
      - name: CPU layout benchmark (not GPU frame timing)
        run: cargo run --quiet --release -p thinoda-core --example layout_benchmark -- --topics 10000 --samples 30 --output layout-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: layout-benchmark-${{ matrix.os }}
          path: layout-benchmark.json
          if-no-files-found: error
