name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  THINODA_AI_SKIP_LIVE: "1"

jobs:
  docs:
    name: Markdown timestamps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The synthetic PR merge commit is not the source revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Test documentation metadata
        run: python -m unittest discover -s .github/scripts -p "test_docs_stamp.py"
      - name: Preview timestamps for committed source
        run: |
          python .github/scripts/docs_stamp.py
          python .github/scripts/docs_stamp.py --check

  docs-refresh:
    name: Refresh Markdown timestamps on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-stamp-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Only metadata is committed. No force push, PR writes, secrets or bypass.
      # GITHUB_TOKEN pushes do not retrigger CI; no diff also means no commit.
      - name: Refresh, verify and fast-forward push metadata
        run: python .github/scripts/docs_stamp.py --refresh-main

  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: THIRD_PARTY_NOTICES.md matches Cargo.lock
        run: python3 .github/scripts/third_party_notices.py --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev xvfb
      - name: Test packaging and native printing bridges
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Repeat ARM64 recovery in isolation (50 crash/restore cycles)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: cargo test -p thinoda-app --test e2e crash_recovery_restores_unsaved_work -- --exact --test-threads=1
      - run: cargo test -p thinoda-core --example layout_benchmark
      - name: CPU layout benchmark (not GPU frame timing)
        run: cargo run --quiet --release -p thinoda-core --example layout_benchmark -- --topics 10000 --samples 30 --output layout-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: layout-benchmark-${{ matrix.os }}
          path: layout-benchmark.json
          if-no-files-found: error

  office:
    name: Office Open XML validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore locked Microsoft Open XML SDK
        run: dotnet restore .github/tools/OpenXmlValidation --locked-mode
      - name: Build schema validator
        run: dotnet build .github/tools/OpenXmlValidation --no-restore --configuration Release
      - name: Generate original Office exports
        run: cargo run --locked -p thinoda-io --example office_candidates -- "$RUNNER_TEMP/office-fixtures"
      - name: Validate Word, PowerPoint and Excel, including negative controls
        env:
          THINODA_OPENXML_VALIDATOR: ${{ github.workspace }}/.github/tools/OpenXmlValidation/bin/Release/net10.0/OpenXmlValidation.dll
          THINODA_OFFICE_FIXTURES: ${{ runner.temp }}/office-fixtures
        run: python .github/scripts/test_openxml_validation.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: office-validation-fixtures
          path: ${{ runner.temp }}/office-fixtures
          if-no-files-found: error

  web:
    name: web app (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test PWA manifest, icons, install lifecycle and offline isolation
        run: node --test crates/thinoda-web/tests/pwa.test.cjs
      - name: Install Trunk
        run: |
          python3 .github/scripts/install_trunk.py "$RUNNER_TEMP/thinoda-tools"
          echo "$RUNNER_TEMP/thinoda-tools" >> "$GITHUB_PATH"
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p thinoda-web -p thinoda-app -p thinoda-platform -p thinoda-ai -p thinoda-io -- -D warnings
      - name: Build static site
        working-directory: crates/thinoda-web
        run: trunk build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: thinoda-web
          path: crates/thinoda-web/dist
          if-no-files-found: error
      - name: Package site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/thinoda-web/dist

  pages:
    name: deploy web app (GitHub Pages)
    # Publishes only main builds whose native, Office and web checks passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, test, office]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  fuzz-smoke:
    name: importer fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> fuzz/target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz target formatting and lints
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run bounded importer campaigns
        run: |
          cargo fuzz run --release xmind -- -max_total_time=20 -rss_limit_mb=2048 -max_len=1048576 -timeout=5 -dict=fuzz/dictionaries/xmind.dict
          cargo fuzz run --release freemind -- -max_total_time=20 -rss_limit_mb=2048 -max_len=1048576 -timeout=5 -dict=fuzz/dictionaries/freemind.dict
          cargo fuzz run --release opml -- -max_total_time=20 -rss_limit_mb=2048 -max_len=1048576 -timeout=5 -dict=fuzz/dictionaries/opml.dict
