# GitLab CI: builds the Thinoda web app (WebAssembly) and publishes it to GitLab Pages.
# The repository is developed on GitHub; mirror it to GitLab (pull mirroring) and this
# pipeline deploys every default-branch commit. See docs/WEB.md.

stages:
  - test
  - build
  - deploy

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always
  THINODA_AI_SKIP_LIVE: "1"
  TRUNK_VERSION: "0.21.14"

default:
  image: rust:latest
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cargo/registry
      - .cargo/git
      - target

.web-toolchain: &web-toolchain
  - rustup target add wasm32-unknown-unknown
  - rustup component add clippy
  - curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
  - trunk --version

web-check:
  stage: test
  before_script: *web-toolchain
  script:
    # Shared crates with browser-specific code, linted for the wasm target.
    - cargo clippy --locked --target wasm32-unknown-unknown -p thinoda-web -p thinoda-app -p thinoda-platform -p thinoda-ai -p thinoda-io -- -D warnings
    # Browser helpers that also run natively: virtual file system, print pages,
    # file names, uploads and recovery suspension across page reloads.
    - apt-get update -qq && apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev
    - cargo test --locked -p thinoda-platform -p thinoda-app --lib -- vfs web files:: suspended
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

web-build:
  stage: build
  before_script: *web-toolchain
  script:
    - cd crates/thinoda-web
    - trunk build --release --locked
    - test -f dist/index.html
    - ls -la dist
  artifacts:
    paths:
      - crates/thinoda-web/dist
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: alpine:latest
  cache: []
  needs: ["web-build"]
  script:
    - rm -rf public
    - cp -r crates/thinoda-web/dist public
    # Precompressed copies; GitLab Pages serves .gz files to supporting browsers.
    - find public -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.html' \) -exec gzip -k -9 {} \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
